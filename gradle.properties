org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.x 默认启用内置 Kotlin 与新 DSL，而 org.jetbrains.kotlin.android 插件
# 与新 DSL 不兼容。为精确使用 Kotlin 2.4.20 + Compose Compiler 2.4.20，
# 关闭内置 Kotlin 与新 DSL（AGP 9.5 仍支持该 opt-out；AGP 10 起新 DSL 强制）。
android.builtInKotlin=false
android.newDsl=false
